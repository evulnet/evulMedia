<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="/static/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<title>{{ name }} — evulMedia</title>
<style>
:root {
  --bg: #0e1013; --bg2: #161a20; --bg3: #1e242c; --line: #2a323d;
  --fg: #dfe5ec; --dim: #8a95a3; --acc: #4da3ff; --acc2: #9b7bff;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg:#f4f6f9; --bg2:#ffffff; --bg3:#e8edf3; --line:#d5dce4;
          --fg:#1c2733; --dim:#5d6b7a; --acc:#1a6fd4; --acc2:#6d4fe0; }
}
:root[data-theme="light"] { --bg:#f4f6f9; --bg2:#ffffff; --bg3:#e8edf3; --line:#d5dce4;
          --fg:#1c2733; --dim:#5d6b7a; --acc:#1a6fd4; --acc2:#6d4fe0; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top:0; z-index:10; background:var(--bg2);
  border-bottom:1px solid var(--line); padding:.7rem 1rem;
  display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; }
header h1 { font-size:1.05rem; margin:0; font-weight:600; letter-spacing:.02em; }
header h1 a { color:var(--fg); text-decoration:none; }
header h1 .sub { color:var(--dim); font-weight:400; }
#filter { margin-left:auto; background:var(--bg3); color:var(--fg);
  border:1px solid var(--line); border-radius:8px; padding:.4rem .7rem;
  font-size:.85rem; width:220px; outline:none; }
#filter:focus { border-color:var(--acc); }
nav { padding:.55rem 1rem; color:var(--dim); font-size:.85rem;
  display:flex; flex-wrap:wrap; gap:.15rem; align-items:center; }
nav a { color:var(--acc); text-decoration:none; }
nav a:hover { text-decoration:underline; }
nav .sep { opacity:.5; margin:0 .25rem; }
#backBtn { background:var(--bg3); border:1px solid var(--line); color:var(--fg);
  border-radius:8px; padding:.25rem .65rem; font-size:.8rem; cursor:pointer;
  margin-right:.5rem; display:none; }
#backBtn:hover { border-color:var(--acc); color:var(--acc); }
main { padding: .4rem 1rem 3rem; }
h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.08em;
  color:var(--dim); margin:1.2rem 0 .6rem; }
.grid { display:grid; gap:.6rem;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.card { background:var(--bg2); border:1px solid var(--line); border-radius:10px;
  overflow:hidden; cursor:pointer; text-decoration:none; color:var(--fg);
  display:flex; flex-direction:column; transition: border-color .12s, transform .12s; }
.card:hover { border-color:var(--acc); transform: translateY(-2px); }
.thumb { width:100%; aspect-ratio:16/10; background:var(--bg3); position:relative;
  display:flex; align-items:center; justify-content:center; overflow:hidden; }
.pip { position:absolute; top:.45rem; right:.45rem; width:.7rem; height:.7rem;
  border-radius:50%; box-shadow:0 0 3px rgba(0,0,0,.6); box-sizing:border-box; }
.pip.d { background:#3fbf6f; }                     /* solid green = watched   */
.pip.p { background:transparent; border:.22rem solid #f5a623; } /* ring = part */
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.icon { font-size:2.2rem; opacity:.85; }
.label { padding:.4rem .55rem; font-size:.78rem; line-height:1.25;
  word-break:break-word; display:flex; flex-direction:column; gap:.15rem; }
.label .meta { color:var(--dim); font-size:.68rem; }
.card.dir .thumb.folder { background:transparent; }
.card.dir .icon svg { width:3.2rem; height:3.2rem; }
.card.dir .icon { color:var(--acc2); }
.badge { display:inline-block; font-size:.6rem; font-weight:700; letter-spacing:.05em;
  padding:.1rem .35rem; border-radius:4px; background:var(--bg3); color:var(--dim);
  text-transform:uppercase; align-self:flex-start; }
.card.video .badge { color:var(--acc); }
.card.image .badge { color:var(--acc2); }
.status { color:var(--dim); padding:2rem; text-align:center; }
.refresh { margin-left:.5rem; background:none; border:1px solid var(--line);
  color:var(--dim); border-radius:8px; padding:.35rem .6rem; font-size:.78rem;
  cursor:pointer; }
.refresh:hover { color:var(--fg); border-color:var(--acc); }
/* modal viewer */
#modal { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:50;
  display:none; align-items:center; justify-content:center; flex-direction:column; }
#modal.open { display:flex; }
#modal .stage { max-width:92vw; max-height:82vh; display:flex;
  align-items:center; justify-content:center; position:relative; }
#modal video { max-width:92vw; max-height:82vh; outline:none; background:#000; border-radius:8px; }
.resumeov { position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; background:rgba(0,0,0,.4); border-radius:8px;
  cursor:pointer; color:#fff; font-size:3rem; line-height:1; }
.resumeov:hover { color:var(--acc); }
.seekctl { display:flex; align-items:center; gap:.5rem; font-size:.8rem; }
.seekctl input[type=range]{ width:200px; accent-color:var(--acc); }
.seekctl .t { font-variant-numeric:tabular-nums; white-space:nowrap; }
#seekableLbl { font-size:.8rem; cursor:pointer; white-space:nowrap; }
#modal img { max-width:92vw; max-height:82vh; border-radius:8px; }
#modal .bar { color:#cfd6de; padding:.8rem 1rem .2rem; max-width:92vw;
  display:flex; gap:1rem; align-items:center; }
#modal .bar .title { font-size:.9rem; }
#modal .bar a { color:var(--acc); font-size:.8rem; }
#modal .x { position:fixed; top:.6rem; right:1rem; font-size:1.6rem; color:#fff;
  cursor:pointer; background:none; border:none; }
#modal .pdfview { width:min(94vw,1100px); height:min(85vh,1200px); background:#fff; border:0; border-radius:8px; }
#modal audio { width:min(80vw,560px); }
.arrow { position:fixed; top:50%; transform:translateY(-50%); font-size:2rem;
  color:#ffffff80; background:none; border:none; cursor:pointer; padding:1rem .4rem; }
.arrow:hover { color:#fff; }
#prev { left:.2rem; } #next { right:.2rem; }
#modal .fs { position:fixed; top:.65rem; right:3.3rem; font-size:1.25rem; color:#fff;
  cursor:pointer; background:none; border:none; opacity:.75; }
#modal .fs:hover { opacity:1; }
#modal:fullscreen, #modal:-webkit-full-screen { background:#000; }
#modal:fullscreen .stage, #modal:-webkit-full-screen .stage { max-width:100vw; max-height:90vh; }
#modal:fullscreen video, #modal:fullscreen img,
#modal:-webkit-full-screen video, #modal:-webkit-full-screen img { max-width:100vw; max-height:88vh; border-radius:0; }
#modal:fullscreen .pdfview, #modal:-webkit-full-screen .pdfview { width:100vw; height:92vh; border-radius:0; }
#modal:fullscreen .bar, #modal:-webkit-full-screen .bar { max-width:100vw; }
#modal:fullscreen .bar .title, #modal:-webkit-full-screen .bar .title,
#modal:fullscreen .bar .links, #modal:-webkit-full-screen .bar .links { display:none; }
.ppbtn { display:none; position:absolute; inset:0; align-items:center; justify-content:center;
  font-size:56px; color:#fff; background:rgba(0,0,0,.35); border-radius:8px;
  cursor:pointer; text-shadow:0 2px 12px #000; }
.stage:has(video) .ppbtn, .media:has(video) .ppbtn { border-radius:8px; }
.spin { display:inline-block; width:.85rem; height:.85rem; margin-right:.5rem;
  border:2px solid var(--acc); border-right-color:transparent; border-radius:50%;
  vertical-align:-2px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* settings */
.cogbtn { background:none; border:1px solid var(--line); color:var(--dim);
  border-radius:8px; width:2rem; height:2rem; cursor:pointer; font-size:1rem; line-height:1; }
.cogbtn:hover { color:var(--fg); border-color:var(--acc); }
#settings { position:fixed; top:3.3rem; right:1rem; z-index:30; background:var(--bg2);
  border:1px solid var(--line); border-radius:10px; padding:.65rem .75rem; min-width:230px;
  display:flex; flex-direction:column; gap:.5rem; box-shadow:0 8px 24px rgba(0,0,0,.35);
  font-size:.83rem; color:var(--fg); }
#settings[hidden] { display:none; }
#settings label { display:flex; justify-content:space-between; align-items:center; gap:.6rem; }
#settings label.chk { justify-content:flex-start; cursor:pointer; }
#settings select { background:var(--bg3); color:var(--fg); border:1px solid var(--line);
  border-radius:6px; padding:.2rem .35rem; font-size:.8rem; }
#settings .hint { color:var(--dim); font-size:.72rem; border-top:1px solid var(--line); padding-top:.5rem; }
body.no-size .label .meta { display:none; }
.subov { position:absolute; left:5%; right:5%; bottom:10%; text-align:center;
  color:#fff; font-size:clamp(1rem,2.4vw,1.7rem); line-height:1.35; font-weight:600;
  text-shadow:0 0 4px #000, 0 2px 4px #000; pointer-events:none; white-space:pre-wrap; }
.ccctl { cursor:pointer; color:var(--acc); font-size:.8rem; user-select:none;
  margin-left:auto; padding:0 .3rem; }
.ccctl:hover { text-decoration:underline; }
</style>
</head>
<body>
<header>
  <h1><a href="/" id="homelink">{{ name }}</a> <span class="sub">/ evulMedia</span></h1>
  <input id="filter" type="search" placeholder="filter this folder…" autocomplete="off">
  <button class="refresh" id="refreshBtn" title="rescan this folder">⟳</button>
  <button class="cogbtn" id="cogBtn" title="settings">⚙</button>
</header>
<div id="settings" hidden>
  <label>theme <select id="themeSel">
    <option value="auto">auto</option><option value="dark">dark</option><option value="light">light</option>
  </select></label>
  <label>video playback <select id="pbSel">
    <option value="auto">auto</option><option value="seekable">seekable MP4</option><option value="transcode">force transcode</option>
  </select></label>
  <label class="chk"><input type="checkbox" id="autoplayChk"> autoplay</label>
  <label class="chk"><input type="checkbox" id="sizeChk"> show file sizes</label>
  <label class="chk"><input type="checkbox" id="subsChk"> subtitles (when available)</label>
  <label class="chk"><input type="checkbox" id="watchChk"> watch list (pips)</label>
  <label class="chk"><input type="checkbox" id="resumeChk"> resume videos</label>
  <label class="chk"><input type="checkbox" id="dirChk"> remember last folder</label>
  <div class="hint">lightbox: ⛶ = fullscreen (or double-click an image)</div>
</div>
<nav id="crumbs"><button id="backBtn" title="up one level">← Back</button><span id="crumbLinks"></span></nav>
<main><div id="content" class="status">loading…</div></main>

<div id="modal">
  <button class="x" title="close (Esc)">✕</button>
  <button class="fs" id="fsBtn" title="fullscreen (F)">⛶</button>
  <button class="arrow" id="prev">‹</button>
  <button class="arrow" id="next">›</button>
  <div class="stage"></div>
  <div class="bar"><span class="title"></span><span class="links"></span></div>
</div>

<script>
const ROOT_NAME = {{ name|tojson }};
// Safari rejects the chunked /stream pipe regardless of codec — its
// "transcode" must be a file (remux endpoint with forced h264).
const IS_SAFARI = /Apple Computer/.test(navigator.vendor);
const TC_KIND = IS_SAFARI ? 'mp4tc' : true;
const content = document.getElementById('content');
const crumbs = document.getElementById('crumbs');
const crumbLinks = document.getElementById('crumbLinks');
const backBtn = document.getElementById('backBtn');
backBtn.addEventListener('click', () => go(current.parent == null ? '' : current.parent));
const filterEl = document.getElementById('filter');
let current = { dirs: [], files: [] };
let mediaSeq = [];   // media files in view order, for prev/next
let seqIdx = -1;

function esc(s){ const d=document.createElement('span'); d.textContent=s; return d.innerHTML; }
function fmtSize(b){
  if (b == null) return '';
  const u=['B','KB','MB','GB','TB']; let i=0;
  while (b>=1024 && i<u.length-1){ b/=1024; i++; }
  return (b<10 && i>0 ? b.toFixed(1) : Math.round(b)) + ' ' + u[i];
}
function fmtDate(t){ return new Date(t*1000).toLocaleDateString(); }
function fmtT(t){ t=Math.max(0,Math.floor(t));
  const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0'); }
const seekPref = () => localStorage.getItem('mbSeekable') === '1';
const pbMode = () => localStorage.getItem('mbPbMode')
  || (seekPref() ? 'seekable' : 'auto');   // migrated old preference key
const autoplayOn = () => localStorage.getItem('mbAutoplay') !== '0';
const subsOn = () => localStorage.getItem('mbSubs') === '1';   // opt-in per user
const watchOn = () => localStorage.getItem('mbWatchOn') !== '0';    // default on
const resumeOn = () => localStorage.getItem('mbResume') !== '0';    // default on
const rememberOn = () => localStorage.getItem('mbLastDirOn') !== '0'; // default on
function q(p){ return '?path=' + encodeURIComponent(p); }
function join(dir, name){ return dir ? dir + '/' + name : name; }

function renderCrumbs(data){
  let html = '<a href="/" data-path="">home</a>';
  const parts = data.path ? data.path.split('/') : [];
  parts.forEach((p, i) => {
    const path = parts.slice(0, i+1).join('/');
    html += '<span class="sep">/</span><a href="/browse/' + encodeURI(path) + '" data-path="' + esc(path) + '">' + esc(p) + '</a>';
  });
  crumbLinks.innerHTML = html;
  crumbLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); go(a.dataset.path);
  }));
  backBtn.style.display = data.path ? '' : 'none';
}

function cardHTML(base, name, opts){
  // opts: {kind, size, mtime, isDir, archive, thumbUrl}
  const path = join(base, name);
  const isFolder = opts.isDir || opts.archive;
  const cls = 'card ' + (isFolder ? 'dir' : opts.kind);
  const badge = isFolder
    ? (opts.archive ? '<span class="badge">zip</span>' : '')
    : '<span class="badge">' + opts.kind + '</span>';
  const meta = isFolder ? '' :
    '<span class="meta">' + fmtSize(opts.size) + ' · ' + fmtDate(opts.mtime) + '</span>';
  let thumb;
  const FOLDER_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>';
  if (isFolder) thumb = '<div class="thumb folder"><span class="icon">' + FOLDER_SVG + '</span></div>';
  else if (opts.thumbUrl) thumb = '<div class="thumb"><img loading="lazy" src="' + opts.thumbUrl + '" alt=""></div>';
  else if (opts.kind === 'audio') thumb = '<div class="thumb"><span class="icon">\u266a</span></div>';
  else thumb = '<div class="thumb"><span class="icon">\u2261</span></div>';
  if (!isFolder) thumb = thumb.slice(0, -6) + watchPip(path) + '</div>';
  const href = isFolder ? 'data-dir="' + esc(path) + '"' : 'data-file="' + esc(path) + '" data-kind="' + opts.kind + '"';
  return '<a class="' + cls + '" ' + href + ' title="' + esc(name) + '">' +
    thumb + '<div class="label"><span>' + esc(name) + '</span>' + badge + meta + '</div></a>';
}

function render(data){
  current = data;
  renderCrumbs(data);
  const base = data.path;
  let html = '';
  if (data.dirs.length){
    html += '<h2>Folders · ' + data.dirs.length + '</h2><div class="grid">';
    for (const d of data.dirs){
      const dn = typeof d === 'string' ? d : d.name;
      html += cardHTML(base, dn, {isDir:true, archive: typeof d !== 'string' && d.archive});
    }
    html += '</div>';
  }
  const MK = ['image','video','audio','pdf'];
  const media = data.files.filter(f => MK.includes(f.kind));
  const other = data.files.filter(f => !MK.includes(f.kind));
  if (media.length){
    html += '<h2>Media · ' + media.length + '</h2><div class="grid">';
    for (const f of media) html += cardHTML(base, f.name, {...f, thumbUrl: f.thumb ? '/thumb' + q(join(base, f.name)) : ''});
    html += '</div>';
  }
  if (other.length){
    html += '<h2>Other · ' + other.length + '</h2><div class="grid">';
    for (const f of other) html += cardHTML(base, f.name, f);
    html += '</div>';
  }
  if (!data.dirs.length && !data.files.length) html = '<div class="status">empty folder</div>';
  content.className = '';
  content.innerHTML = html;

  content.querySelectorAll('[data-dir]').forEach(el =>
    el.addEventListener('click', e => { e.preventDefault(); go(el.dataset.dir); }));
  mediaSeq = media.map(f => ({path: join(base, f.name), kind: f.kind, name: f.name}));
  content.querySelectorAll('[data-file]').forEach(el =>
    el.addEventListener('click', e => {
      e.preventDefault();
      const p = el.dataset.file;
      if (['image','video','audio','pdf'].includes(el.dataset.kind)) openModal(p);
      else window.open('/view' + q(p), '_blank');
    }));
  applyFilter();
}

function applyFilter(){
  const needle = filterEl.value.trim().toLowerCase();
  content.querySelectorAll('.card').forEach(c => {
    c.style.display = !needle || c.textContent.toLowerCase().includes(needle) ? '' : 'none';
  });
}
filterEl.addEventListener('input', applyFilter);

async function go(path, push=true, force=false){
  history; // no-op
  if (rememberOn()) localStorage.setItem('mbLastFolder', path);
  content.className = 'status'; content.textContent = 'loading…';
  if (push) history.pushState({path}, '', dirUrl(path));
  document.title = (path || ROOT_NAME) + ' — evulMedia';
  const r = await fetch('/api/ls' + q(path) + (force ? '&refresh=1' : ''));
  if (!r.ok){ content.textContent = 'error ' + r.status; return; }
  render(await r.json());
  window.scrollTo(0, 0);
}
document.getElementById('refreshBtn').addEventListener('click', () => go(current.path, false, true));

// ---- modal viewer ----
const modal = document.getElementById('modal');
const stage = modal.querySelector('.stage');
function openModal(path, push=true){
  seqIdx = mediaSeq.findIndex(m => m.path === path);
  if (seqIdx < 0) return;
  showCurrent(false);
  modal.classList.add('open');
  if (push) history.pushState({media:path}, '', mediaUrl(path));
}
async function showCurrent(forceKind){
  const m = mediaSeq[seqIdx];
  if (!m) return;
  // playback preference from the settings cog: auto | seekable | transcode
  if (!forceKind && !m.url && m.kind === 'video' && pbMode() !== 'auto')
    forceKind = pbMode() === 'seekable' ? 'mp4' : TC_KIND;
  modal.querySelector('.bar').querySelectorAll('.seekctl, .ccctl').forEach(n => n.remove());
  const gen = ++uiGen;                       // invalidate pending async UI from previous item
  modal.querySelector('.title').textContent = m.name;
  if ((forceKind === 'mp4' && m.mode !== 'mp4') || forceKind === 'mp4tc')
    stage.innerHTML = '<div class="status" style="color:#9cf"><span class="spin"></span>' +
      (forceKind === 'mp4tc' ? 'preparing file transcode (30-90s)…'
                             : 'preparing MP4 remux (~10-30s)…') + '</div>';
  m.resume = 0;
  if (m.kind === 'video' && watchOn() && resumeOn()) {
    const rec = watchStore()[m.path];
    if (rec && rec.s === 'p' && rec.t > 20 && (!rec.d || rec.t < rec.d - 20))
      m.resume = rec.t;
  }
  if (forceKind || !m.url) {
    const want = (forceKind === 'mp4' || forceKind === 'mp4tc') ? '&mode=mp4'
               : forceKind ? '&mode=stream' : '';
    const r = await fetch('/api/sign?path=' + encodeURIComponent(m.path) + want);
    if (r.ok) {
      const s = await r.json();
      m.url = s.url; m.mode = s.mode; m.dur = s.dur || 0; m.offset = 0;
      m.transcode = !!s.transcode;
      if ((forceKind === true && m.mode === 'stream') || forceKind === 'mp4tc')
        m.url += (m.url.indexOf('?') >= 0 ? '&' : '?') + 'transcode=1';
      if (m.resume && m.mode === 'stream')
        m.url += (m.url.indexOf('?') >= 0 ? '&' : '?') + 'start=' + m.resume;
    }
  }
  const url = m.url || '/view' + q(m.path);
  const ap = autoplayOn() ? ' autoplay' : '';
  const isBuild = m.kind === 'video' && m.mode === 'mp4';   // async /remux
  stage.innerHTML = m.kind === 'video'
    ? '<video playsinline' + (isBuild ? '' : ' src="' + url + '"') + ' controls' + ap + '></video>'
    : m.kind === 'audio'
    ? '<audio src="' + url + '" controls' + ap + '></audio>'
    : m.kind === 'pdf'
    ? '<iframe class="pdfview" src="' + url + '"></iframe>'
    : '<img src="' + url + '" alt="">';
  if (m.kind === 'image' || m.kind === 'pdf') watchSet(m.path, 'done');
  if (m.kind === 'video' || m.kind === 'audio') {
    const el = stage.querySelector('video, audio');
    if (m.kind === 'video' && m.mode === 'stream') { m.base = url; m.offset = m.resume || 0; attachStreamControls(el, m); }
    if (m.resume && m.kind === 'video' && m.mode !== 'stream')
      el.addEventListener('loadedmetadata', () => {
        try { el.currentTime = Math.min(m.resume, (el.duration || m.resume + 1) - 5); }
        catch (e) {}
      }, { once: true });
    attachProgress(m, el);
    if (isBuild) {
      // Detached build: poll /remux?status=1 (first poll also spawns it),
      // mount the source only when the file is ready. No browser ever waits
      // on a multi-minute build, so no mid-build timeout kills playback.
      const ov = document.createElement('div');
      ov.className = 'status';
      ov.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border-radius:8px';
      ov.innerHTML = '<span class="spin"></span>' + (m.transcode
        ? 'transcoding \u2014 long files can take minutes\u2026'
        : 'building seekable MP4\u2026');
      stage.appendChild(ov);
      (async () => {
        const my = gen;
        const su = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'status=1';
        const every = ms => new Promise(r => setTimeout(r, ms));
        for (let i = 0; i < 800; i++) {          // up to ~40 min
          let st = 'idle';
          try { st = (await (await fetch(su)).json()).state; } catch (e) {}
          if (my !== uiGen) return;              // user moved on (build continues)
          if (st === 'ready') break;
          if (st === 'error') { ov.remove(); failover(); return; }
          await every(i < 20 ? 1500 : 3000);
        }
        if (my !== uiGen) return;
        el.src = url;
        el.play().then(() => {}, () => { pp.style.display = 'flex'; });
        el.addEventListener('loadedmetadata', () => ov.remove(), {once:true});
        el.addEventListener('error', () => { ov.remove(); failover(); }, {once:true});
      })();
    }
    if (m.kind === 'video' && subsOn()) setupSubs(el, m, gen);
    const failover = () => {
      // Safari rejects the chunked /stream pipe: fall back to the seekable
      // MP4 remux, then to a file/pipe transcode (per-browser), then give up.
      if (m.mode === 'stream' && m.kind === 'video' && !m.retry) {
        m.retry = 'mp4'; showCurrent('mp4'); return;
      }
      if (m.mode === 'stream' && m.retry !== 'tc') {
        m.retry = 'tc'; showCurrent(TC_KIND); return;
      }
      if (m.retry === 'mp4') {
        m.retry = 'tc'; showCurrent(TC_KIND); return;
      }
      stage.innerHTML = '<div class="status" style="color:#f77">playback failed \u2014 unsupported format or transcode pool busy</div>';
    };
    el.addEventListener('error', failover);

    // Autoplay policy fallback: our async chain (sign -> poll -> src) burns
    // the user gesture, so iOS (and strict desktop policies) silently block
    // playback and leave a black box. Offer a real gesture anywhere.
    const pp = document.createElement('div');
    pp.className = 'ppbtn';
    pp.textContent = '\u25B6';
    pp.onclick = () => el.play().then(() => pp.remove(), () => {});
    stage.appendChild(pp);
    el.addEventListener('playing', () => pp.remove());
    const tryPlay = () => { if (autoplayOn() && !el.src) return; el.play().then(() => {}, () => { pp.style.display = 'flex'; }); };
    if (!isBuild && (m.kind === 'video' || m.kind === 'audio')) tryPlay();
    el.addEventListener('loadedmetadata', () => { if (el.paused && (m.kind === 'video' || m.kind === 'audio')) pp.style.display = 'flex'; }, { once: true });
  }
  modal.querySelector('.links').innerHTML =
    '<a href="' + url + '" download="' + esc(m.name) + '">download</a>';
  if (modal.classList.contains('open'))
    history.replaceState({media:m.path}, '', mediaUrl(m.path));
}
function step(d){
  if (!mediaSeq.length) return;
  seqIdx = (seqIdx + d + mediaSeq.length) % mediaSeq.length;
  showCurrent();
}
// ---- live /stream pseudo-seek + pause/resume --------------------------
// The /stream pipe has no index and dies after MB_STALL_TIMEOUT when
// unconsumed (a pause stops consumption). So: seek = reconnect with
// ?start=SECONDS (ffmpeg input-seeks, output timeline restarts at 0, we
// track the content offset); pause = tear the connection down at once
// (frees the transcode slot) and resume later at the remembered position.
function attachStreamControls(el, m){
  const bar = modal.querySelector('.bar');
  let tearing = false, ended = false, userScrub = false;
  const pos = () => (el.currentTime || 0) + (m.offset || 0);
  const streamUrl = t => m.base + (m.base.indexOf('?') >= 0 ? '&' : '?')
                          + 'start=' + Math.max(0, t).toFixed(1);
  let rng = null, tspan = null;
  if (m.dur > 0){
    const ctl = document.createElement('span'); ctl.className = 'seekctl';
    rng = document.createElement('input');
    rng.type = 'range'; rng.min = 0; rng.max = Math.floor(m.dur); rng.step = 1;
    rng.title = 'seek (reconnects the live stream)';
    tspan = document.createElement('span'); tspan.className = 't';
    tspan.textContent = '0:00 / ' + fmtT(m.dur);
    ctl.appendChild(rng); ctl.appendChild(tspan); bar.appendChild(ctl);
    rng.addEventListener('input', () => {
      userScrub = true; tspan.textContent = fmtT(rng.valueAsNumber) + ' / ' + fmtT(m.dur);
    });
    rng.addEventListener('change', () => { userScrub = false; reconnect(rng.valueAsNumber); });
  }
  function reconnect(t){
    m.offset = t;
    el.src = streamUrl(t);
    el.play().catch(() => {});
  }
  el.addEventListener('timeupdate', () => {
    if (!rng || userScrub || tearing) return;
    rng.value = pos();
    tspan.textContent = fmtT(pos()) + ' / ' + fmtT(m.dur);
  });
  el.addEventListener('ended', () => { ended = true; });
  el.addEventListener('pause', () => {
    if (tearing || ended) return;
    const at = pos();
    tearing = true;
    el.pause();
    el.removeAttribute('src'); el.load();   // close the pipe, free the slot
    tearing = false;
    const ov = document.createElement('div');
    ov.className = 'resumeov'; ov.textContent = '\u25b6';
    ov.title = 'Resume from ' + fmtT(at);
    ov.addEventListener('click', () => {
      m.offset = at;
      el.src = streamUrl(at);
      el.play().catch(() => {});
      ov.remove();
    });
    modal.querySelector('.stage').appendChild(ov);
  });
}
document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); step(-1); });
document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); step(1); });
modal.addEventListener('click', e => { if (e.target === modal || e.target.classList.contains('x')) closeModal(); });
function closeModal(){
  modal.classList.remove('open');
  stage.innerHTML = '';
  history.replaceState({path:current.path}, '', dirUrl(current.path));
}
document.addEventListener('keydown', e => {
  if (!settings.hidden && e.key === 'Escape') { settings.hidden = true; return; }
  if (!modal.classList.contains('open')) return;
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA') return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'f' || e.key === 'F') toggleFS();
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
});

/** Subtitles: self-rendered (no <track>; Safari won't reliably load those).
 *  CC button cycles: off -> track1 -> track2 -> ... -> off. */
let uiGen = 0;
async function setupSubs(el, m, gen){
  let list = [];
  try { list = (await (await fetch('/api/subs' + q(m.path))).json()).subs || []; }
  catch (e) { return; }
  if (gen !== uiGen || !list.length) return;   // user moved on; drop stale setup
  m.subCache = m.subCache || {};
  let idx = -1, cues = null;
  const bar = modal.querySelector('.bar');
  const ov = document.createElement('div'); ov.className = 'subov';
  modal.querySelector('.stage').appendChild(ov);
  const btn = document.createElement('span'); btn.className = 'ccctl';
  const name = i => (list[i].label || ('#' + (i + 1)));
  const draw = () => { btn.textContent = idx < 0 ? 'cc off' : 'cc ' + name(idx); };
  async function load(){
    const s = list[idx];
    if (m.subCache[s.key]) { cues = m.subCache[s.key]; return; }
    btn.textContent = 'cc \u23f3';
    try {
      cues = m.subCache[s.key] =
        parseVTT(await (await fetch('/subs' + q(m.path) + '&key=' + encodeURIComponent(s.key))).text());
    } catch (e) { cues = []; }
  }
  function sync(){
    if (idx < 0 || !cues) { ov.textContent = ''; return; }
    const t = (el.currentTime || 0) + (m.offset || 0);
    const c = cues.find(x => t >= x.t0 && t <= x.t1);
    const txt = c ? c.txt : '';
    if (ov.textContent !== txt) ov.textContent = txt;
  }
  btn.addEventListener('click', async () => {
    idx = (idx + 1) % (list.length + 1);
    if (idx >= list.length) { idx = -1; cues = null; } else await load();
    draw(); sync();
  });
  el.addEventListener('timeupdate', sync);
  bar.appendChild(btn); draw();
}
function parseVTT(text){
  const out = [];
  for (const block of text.split(/\r?\n\r?\n/)){
    const lines = block.split(/\r?\n/);
    const ti = lines.findIndex(l => l.includes('-->'));
    if (ti < 0) continue;
    const [a, bRaw] = lines[ti].split('-->');
    const t0 = vts(a), t1 = vts((bRaw || '').trim().split(/\s/)[0]);
    if (t0 == null || t1 == null) continue;
    const txt = lines.slice(ti + 1).join('\n').replace(/<[^>]+>/g, '')
      .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&rlm;/g, '').replace(/&lrm;/g, '').trim();
    if (txt) out.push({t0, t1, txt});
  }
  return out;
}
function vts(s){
  const p = s.trim().split(':'); if (!p.length) return null;
  const x = p.pop().split('.'); let t = parseFloat(x[0]);
  if (p.length) t += parseFloat(p.pop()) * 60;
  if (p.length) t += parseFloat(p.pop()) * 3600;
  return isFinite(t) ? t : null;
}

// ---- watch list (localStorage only; server stays stateless) ----------
// Video: ring pip = partially watched (position kept for resume), solid
// green pip = finished. Audio/images/PDF/archive-members: solid pip once
// viewed (audio at >=90%, images/PDF on open, video near the end or on
// 'ended'). Keys are virtual paths, so files INSIDE .zip/.cbz/.rar get
// their own pips. Everything is per-browser by design: no server state.
const WATCH_CAP = 400;
function watchStore(){
  try { return JSON.parse(localStorage.getItem('mbWatch')) || {}; }
  catch (e) { return {}; }
}
function watchSet(path, state, t, dur){
  if (!watchOn()) return;
  const w = watchStore();
  w[path] = state === 'done' ? { s: 'd', ts: Date.now() }
    : { s: 'p', t: Math.round(t), d: Math.round(dur || 0), ts: Date.now() };
  const ks = Object.keys(w);
  if (ks.length > WATCH_CAP)
    ks.sort((a, b) => w[a].ts - w[b].ts).slice(0, ks.length - WATCH_CAP)
      .forEach(k => delete w[k]);
  localStorage.setItem('mbWatch', JSON.stringify(w));
  updatePip(path);
}
function watchPip(path){
  if (!watchOn()) return '';
  const r = watchStore()[path];
  if (!r) return '';
  return '<span class="pip ' + r.s + '" title="'
    + (r.s === 'd' ? 'viewed' : 'resume at ' + fmtT(r.t)) + '"></span>';
}
function updatePip(path){
  document.querySelectorAll('[data-file]').forEach(c => {
    if (c.dataset.file !== path) return;
    const th = c.querySelector('.thumb'); if (!th) return;
    th.querySelectorAll('.pip').forEach(p => p.remove());
    th.insertAdjacentHTML('beforeend', watchPip(path));
  });
}
let lastWatchSave = 0;
function attachProgress(m, el){
  if (!watchOn() || !['video','audio'].includes(m.kind)) return;
  const save = force => {
    const now = Date.now();
    if (!force && now - lastWatchSave < 3000) return;
    lastWatchSave = now;
    const pos = (el.currentTime || 0) + (m.offset || 0);
    const dur = m.dur || el.duration || 0;
    if (m.kind === 'video') {
      const tail = Math.min(15, dur * 0.05);   // don't over-match short clips
      if (dur && pos > dur - tail) watchSet(m.path, 'done');
      else if (pos > Math.min(30, dur * 0.1)) watchSet(m.path, 'partial', pos, dur);
    } else if (dur && pos > dur * 0.9) watchSet(m.path, 'done');
  };
  el.addEventListener('timeupdate', () => save(false));
  el.addEventListener('pause', () => save(true));
  el.addEventListener('ended', () => watchSet(m.path, 'done'));
}

// ---- fullscreen + settings popover ------------------------------------
function fsEl(){ return document.fullscreenElement || document.webkitFullscreenElement; }
function toggleFS(){
  if (fsEl()){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  const rq = modal.requestFullscreen || modal.webkitRequestFullscreen;
  if (rq) rq.call(modal);
}
document.getElementById('fsBtn').addEventListener('click', toggleFS);
stage.addEventListener('dblclick', e => { if (e.target.tagName === 'IMG') toggleFS(); });

const settings = document.getElementById('settings');
const themeSel = document.getElementById('themeSel');
const pbSel = document.getElementById('pbSel');
const autoplayChk = document.getElementById('autoplayChk');
const sizeChk = document.getElementById('sizeChk');
const subsChk = document.getElementById('subsChk');
const watchChk = document.getElementById('watchChk');
const resumeChk = document.getElementById('resumeChk');
const dirChk = document.getElementById('dirChk');
document.getElementById('cogBtn').addEventListener('click', e => {
  e.stopPropagation(); settings.hidden = !settings.hidden;
});
document.addEventListener('click', e => {
  if (!settings.hidden && !settings.contains(e.target)) settings.hidden = true;
});
function applyTheme(v){
  if (v === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', v);
}
themeSel.value = localStorage.getItem('mbTheme') || 'auto';
applyTheme(themeSel.value);
pbSel.value = pbMode();
autoplayChk.checked = autoplayOn();
sizeChk.checked = localStorage.getItem('mbShowSize') !== '0';
document.body.classList.toggle('no-size', !sizeChk.checked);
subsChk.checked = subsOn();
watchChk.checked = watchOn();
resumeChk.checked = resumeOn();
dirChk.checked = rememberOn();
themeSel.addEventListener('change', () => {
  localStorage.setItem('mbTheme', themeSel.value); applyTheme(themeSel.value);
});
pbSel.addEventListener('change', () => {
  localStorage.setItem('mbPbMode', pbSel.value);
  if (modal.classList.contains('open')) {
    const m = mediaSeq[seqIdx];
    if (m) { m.url = null; m.retry = undefined; showCurrent(false); }
  }
});
autoplayChk.addEventListener('change', () =>
  localStorage.setItem('mbAutoplay', autoplayChk.checked ? '1' : '0'));
sizeChk.addEventListener('change', () => {
  localStorage.setItem('mbShowSize', sizeChk.checked ? '1' : '0');
  document.body.classList.toggle('no-size', !sizeChk.checked);
});
subsChk.addEventListener('change', () => {
  localStorage.setItem('mbSubs', subsChk.checked ? '1' : '0');
  if (modal.classList.contains('open')) {
    const m = mediaSeq[seqIdx];
    if (m && ['video','audio'].includes(m.kind)) { m.retry = undefined; showCurrent(false); }
  }
});
watchChk.addEventListener('change', () => {
  localStorage.setItem('mbWatchOn', watchChk.checked ? '1' : '0');
  render(current);        // repaint the grid with/without pips
});
resumeChk.addEventListener('change', () =>
  localStorage.setItem('mbResume', resumeChk.checked ? '1' : '0'));
dirChk.addEventListener('change', () =>
  localStorage.setItem('mbLastDirOn', dirChk.checked ? '1' : '0'));

// ---- routing ----
function dirUrl(p){ return p ? '/browse/' + p.split('/').map(encodeURIComponent).join('/') : '/'; }
function mediaUrl(p){ return '/media/' + p.split('/').map(encodeURIComponent).join('/'); }
function locPath(re){ const m = location.pathname.match(re); return m ? m[1].split('/').map(decodeURIComponent).join('/') : null; }

async function openFromUrl(path){
  const ps = path.split('/');
  let ai = -1;
  ps.forEach((s, i) => { if (ai < 0 && i < ps.length - 1 && /\.(cbz|zip)$/i.test(s)) ai = i; });
  const parent = ai >= 0 ? ps.slice(0, ai+1).join('/') : ps.slice(0, -1).join('/');
  const name   = ai >= 0 ? ps.slice(ai+1).join('/') : ps[ps.length-1];
  await go(parent, false);
  const idx = mediaSeq.findIndex(x => x.name === name);
  if (idx >= 0) { seqIdx = idx; showCurrent(false); modal.classList.add('open'); }
  else go(path, false);   // not a media item; treat as folder
}

window.addEventListener('popstate', () => {
  const mp = locPath(/^\/media\/(.*)$/);
  if (mp !== null && mp !== '') { openFromUrl(mp.replace(/\/+$/,'')); return; }
  const bp = locPath(/^\/browse\/(.*)$/);
  go(bp === null ? '' : bp.replace(/\/+$/,''), false);
});
document.getElementById('homelink').addEventListener('click', e => { e.preventDefault(); go(''); });
const startMedia = locPath(/^\/media\/(.*)$/);
const startBrowse = locPath(/^\/browse\/(.*)$/);
if (startMedia) openFromUrl(startMedia.replace(/\/+$/,''));
else {
  let boot = startBrowse === null ? '' : startBrowse.replace(/\/+$/,'');
  // "remember last folder": a bare root visit returns you where you left off
  if (startBrowse === null && rememberOn())
    boot = localStorage.getItem('mbLastFolder') || '';
  go(boot, false);
}
</script>
